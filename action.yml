---
name: Nix Lefthook CI
description: Build and run lefthook checks in a Nix devShell

inputs:
  accept-flake-config:
    description: Pass --accept-flake-config to nix commands (needed for cachix substituters)
    required: false
    default: "true"
  pre-build-commands:
    description: Shell commands to run before nix build (one per line)
    required: false
    default: ""
  extra-env:
    description: Environment variables prepended to lefthook commands (e.g. "FOO=1 BAR=2")
    required: false
    default: ""
  flake-check-timeout:
    description: Override LEFTHOOK_NIX_FLAKE_CHECK_TIMEOUT (seconds)
    required: false
    default: ""
  flake-eval-timeout:
    description: Override LEFTHOOK_NIX_FLAKE_EVAL_TIMEOUT (seconds)
    required: false
    default: ""
  keep-home:
    description: Keep HOME in nix develop (needed for GNU parallel)
    required: false
    default: "false"
  skip-pre-commit:
    description: Skip pre-commit stage (run only pre-push)
    required: false
    default: "false"
  devshell:
    description: Nix devShell to use (e.g. ci, checks)
    required: false
    default: "ci"
  skip-build:
    description: Skip nix build step (for repos with no default package)
    required: false
    default: "false"
  cachix-cache:
    description: Cachix cache name for nix store caching (empty string disables)
    required: false
    default: "pr0d1r2"
  cachix-auth-token:
    description: Cachix auth token for pushing to cache (empty = read-only)
    required: false
    default: ""
  skip-lefthook:
    description: Skip all lefthook steps (install, pre-commit, pre-push) for build-only jobs
    required: false
    default: "false"
  extra-platforms:
    description: Additional platforms to support via QEMU (e.g. "aarch64-linux"). Installs QEMU and configures nix extra-platforms before the nix daemon starts.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up QEMU for extra platforms
      if: inputs.extra-platforms != ''
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -yq qemu-user-static binfmt-support
        for platform in ${{ inputs.extra-platforms }}; do
          arch="${platform%%-*}"
          sudo update-binfmts --enable "qemu-${arch}" 2>/dev/null || true
        done

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
      if: inputs.extra-platforms == ''
      with:
        extra-conf: |
          access-tokens = github.com=${{ github.token }}

    - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
      if: inputs.extra-platforms != ''
      with:
        extra-conf: |
          access-tokens = github.com=${{ github.token }}
          extra-platforms = ${{ inputs.extra-platforms }}

    - name: Set up cachix
      if: inputs.cachix-cache != ''
      uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc
      with:
        name: ${{ inputs.cachix-cache }}
        authToken: ${{ inputs.cachix-auth-token != '' && github.event.repository.private == false && inputs.cachix-auth-token || '' }}

    - name: Cachix push skipped (private repo)
      if: inputs.cachix-auth-token != '' && github.event.repository.private == true
      shell: bash
      run: echo "::warning::Cachix push skipped -- repository is private. Push is only enabled for public repos to prevent leaking private build artifacts."

    - name: Pre-build commands
      if: inputs.pre-build-commands != ''
      shell: bash
      run: ${{ inputs.pre-build-commands }}

    - name: Build
      if: inputs.skip-build != 'true'
      shell: bash
      run: nix build ${{ inputs.accept-flake-config == 'true' && '--accept-flake-config' || '' }}

    - name: Install lefthook remotes
      if: inputs.skip-lefthook != 'true'
      shell: bash
      env:
        STAGE: install
        DEVSHELL: ${{ inputs.devshell }}
        ACCEPT_FLAKE_CONFIG: ${{ inputs.accept-flake-config }}
        EXTRA_ENV: ${{ inputs.extra-env }}
      run: bash ${{ github.action_path }}/run-lefthook.sh

    - name: Pre-commit checks
      if: inputs.skip-lefthook != 'true' && inputs.skip-pre-commit != 'true'
      shell: bash
      env:
        STAGE: pre-commit
        DEVSHELL: ${{ inputs.devshell }}
        ACCEPT_FLAKE_CONFIG: ${{ inputs.accept-flake-config }}
        KEEP_HOME: ${{ inputs.keep-home }}
        EXTRA_ENV: ${{ inputs.extra-env }}
        FLAKE_CHECK_TIMEOUT: ${{ inputs.flake-check-timeout }}
        FLAKE_EVAL_TIMEOUT: ${{ inputs.flake-eval-timeout }}
      run: bash ${{ github.action_path }}/run-lefthook.sh

    - name: Pre-push checks
      if: inputs.skip-lefthook != 'true'
      shell: bash
      env:
        STAGE: pre-push
        DEVSHELL: ${{ inputs.devshell }}
        ACCEPT_FLAKE_CONFIG: ${{ inputs.accept-flake-config }}
        KEEP_HOME: ${{ inputs.keep-home }}
        EXTRA_ENV: ${{ inputs.extra-env }}
        FLAKE_CHECK_TIMEOUT: ${{ inputs.flake-check-timeout }}
        FLAKE_EVAL_TIMEOUT: ${{ inputs.flake-eval-timeout }}
      run: bash ${{ github.action_path }}/run-lefthook.sh

    - name: Flush cachix daemon
      if: inputs.cachix-cache != '' && inputs.cachix-auth-token != '' && github.event.repository.private == false
      shell: bash
      run: |
        # Composite actions have no post: step, so the cachix daemon
        # never flushes. Stop it explicitly to push pending store paths.
        if [ -n "${CACHIX_DAEMON_DIR:-}" ] && [ -S "${CACHIX_DAEMON_DIR}/cachix-daemon.sock" ]; then
          cachix daemon stop --socket "${CACHIX_DAEMON_DIR}/cachix-daemon.sock" || true
        fi
