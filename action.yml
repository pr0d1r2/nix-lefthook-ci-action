---
name: Nix Lefthook CI
description: Build and run lefthook checks in a Nix devShell

inputs:
  accept-flake-config:
    description: Pass --accept-flake-config to nix commands (needed for cachix substituters)
    required: false
    default: "true"
  pre-build-commands:
    description: Shell commands to run before nix build (one per line)
    required: false
    default: ""
  extra-env:
    description: Environment variables prepended to lefthook commands (e.g. "FOO=1 BAR=2")
    required: false
    default: ""
  flake-check-timeout:
    description: Override LEFTHOOK_NIX_FLAKE_CHECK_TIMEOUT (seconds)
    required: false
    default: ""
  keep-home:
    description: Keep HOME in nix develop (needed for GNU parallel)
    required: false
    default: "false"
  skip-pre-commit:
    description: Skip pre-commit stage (run only pre-push)
    required: false
    default: "false"
  devshell:
    description: Nix devShell to use (e.g. ci, checks)
    required: false
    default: "ci"
  skip-build:
    description: Skip nix build step (for repos with no default package)
    required: false
    default: "false"
  cachix-cache:
    description: Cachix cache name for nix store caching (empty string disables)
    required: false
    default: "pr0d1r2"
  cachix-auth-token:
    description: Cachix auth token for pushing to cache (empty = read-only)
    required: false
    default: ""
  skip-lefthook:
    description: Skip all lefthook steps (install, pre-commit, pre-push) for build-only jobs
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Set up cachix
      if: inputs.cachix-cache != ''
      uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc
      with:
        name: ${{ inputs.cachix-cache }}
        authToken: ${{ inputs.cachix-auth-token != '' && github.event.repository.private == false && inputs.cachix-auth-token || '' }}

    - name: Cachix push skipped (private repo)
      if: inputs.cachix-auth-token != '' && github.event.repository.private == true
      shell: bash
      run: echo "::warning::Cachix push skipped — repository is private. Push is only enabled for public repos to prevent leaking private build artifacts."

    - name: Pre-build commands
      if: inputs.pre-build-commands != ''
      shell: bash
      run: ${{ inputs.pre-build-commands }}

    - name: Build
      if: inputs.skip-build != 'true'
      shell: bash
      run: nix build ${{ inputs.accept-flake-config == 'true' && '--accept-flake-config' || '' }}

    - name: Install lefthook remotes
      if: inputs.skip-lefthook != 'true'
      shell: bash
      run: |
        TERM=dumb nix develop \
          ${{ inputs.accept-flake-config == 'true' && '--accept-flake-config' || '' }} \
          .#${{ inputs.devshell }} --ignore-environment --keep TERM \
          --command bash -c \
          '${{ inputs.extra-env }} lefthook install'

    - name: Pre-commit checks
      if: inputs.skip-lefthook != 'true' && inputs.skip-pre-commit != 'true'
      shell: bash
      run: |
        TERM=dumb nix develop \
          ${{ inputs.accept-flake-config == 'true' && '--accept-flake-config' || '' }} \
          .#${{ inputs.devshell }} --ignore-environment --keep TERM \
          ${{ inputs.keep-home == 'true' && '--keep HOME' || '' }} \
          --command bash -c \
          '${{ inputs.keep-home == 'true' && 'mkdir -p "$HOME/.parallel" && touch "$HOME/.parallel/will-cite";' || '' }} ${{ inputs.extra-env }} ${{ inputs.flake-check-timeout != '' && format('LEFTHOOK_NIX_FLAKE_CHECK_TIMEOUT={0}', inputs.flake-check-timeout) || '' }} lefthook run pre-commit --all-files'

    - name: Pre-push checks
      if: inputs.skip-lefthook != 'true'
      shell: bash
      run: |
        TERM=dumb nix develop \
          ${{ inputs.accept-flake-config == 'true' && '--accept-flake-config' || '' }} \
          .#${{ inputs.devshell }} --ignore-environment --keep TERM \
          ${{ inputs.keep-home == 'true' && '--keep HOME' || '' }} \
          --command bash -c \
          '${{ inputs.keep-home == 'true' && 'mkdir -p "$HOME/.parallel" && touch "$HOME/.parallel/will-cite";' || '' }} ${{ inputs.extra-env }} ${{ inputs.flake-check-timeout != '' && format('LEFTHOOK_NIX_FLAKE_CHECK_TIMEOUT={0}', inputs.flake-check-timeout) || '' }} lefthook run pre-push --all-files'
