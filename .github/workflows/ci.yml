---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./
        with:
          skip-build: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  check-darwin:
    needs: check-linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./
        with:
          skip-build: "true"
          skip-lefthook: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  check-linux-arm:
    needs: check-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./
        with:
          skip-build: "true"
          extra-platforms: aarch64-linux
          skip-lefthook: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
